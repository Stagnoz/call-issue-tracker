services:
  app:
    build: .
    image: call-issue-tracker:local
    ports:
      - "8000:8000"
    environment:
      # Every variable has a default, so no .env file is needed.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/issues.db}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Rome}
    volumes:
      # The SQLite file lives on a named volume: it survives restarts and
      # container rebuilds. `docker compose down -v` deletes it.
      - issue-data:/data
    restart: unless-stopped
    healthcheck:
      # The slim image has no curl, so the check uses Python.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  issue-data:
