[project]
name = "call-issue-tracker"
version = "1.0.0"
description = "Internal tool to record and analyze issues found in AI assistant phone calls."
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: bugbear, UP: pyupgrade,
# SIM: simplifications.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection uses calls like Depends() and Query() as
# argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
