<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · {{ t("app.name") }}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="app-name" href="/issues"><span class="app-mark" aria-hidden="true"></span>{{ t("app.name") }}</a>
      <div class="topbar-right">
        <nav aria-label="{{ t('nav.main') }}">
          <a href="/issues"{% if active == "issues" %} aria-current="page"{% endif %}>{{ t("nav.issues") }}</a>
          <a href="/issues/new"{% if active == "new" %} aria-current="page"{% endif %}>{{ t("nav.new") }}</a>
          <a href="/dashboard"{% if active == "dashboard" %} aria-current="page"{% endif %}>{{ t("nav.dashboard") }}</a>
        </nav>
        <form class="lang-switch" method="post" action="/language" aria-label="{{ t('lang.label') }}">
          <input type="hidden" name="next" value="{{ current_url }}">
          {% for code in ("en", "it") %}
            <button type="submit" name="lang" value="{{ code }}" title="{{ t('lang.' ~ code) }}" aria-label="{{ t('lang.' ~ code) }}"
                    aria-pressed="{{ 'true' if lang == code else 'false' }}">{{ code | upper }}</button>
          {% endfor %}
        </form>
      </div>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
